<div class="controls">

let results = VENUES.map(v => ({...v, lat: null, lng: null, status: 'pending'}));
let paused = false, stopped = false, ok = 0, fail = 0, filter = 'all';

function log(msg, cls='') {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 600) el.removeChild(el.firstChild);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function geocode(address) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(address)}&key=${API_KEY}&region=au&components=country:AU`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (data.status === 'OK' && data.results?.length) {
    const loc = data.results[0].geometry.location;
    return { lat: loc.lat, lng: loc.lng, formatted: data.results[0].formatted_address };
  }
  return null;
}

function updateStats(i) {
  document.getElementById('nOk').textContent = ok;
  document.getElementById('nFail').textContent = fail;
  document.getElementById('nLeft').textContent = VENUES.length - i;
  document.getElementById('nPct').textContent = Math.round(i/VENUES.length*100) + '%';
  document.getElementById('pbar').style.width = (i/VENUES.length*100).toFixed(1) + '%';
  document.getElementById('status').textContent = `${i} / ${VENUES.length} · ${ok} geocoded · ${fail} failed`;
}

function renderTable() {
  const filtered = results.filter(r =>
    filter === 'all' ? true :
    filter === 'ok' ? r.status === 'ok' :
    filter === 'fail' ? r.status === 'fail' :
    r.status === 'pending'
  );
  document.getElementById('tbody').innerHTML = filtered.map(r => `
    <tr>
      <td>${r.name}</td>
      <td style="font-size:11px;color:#64748b;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.address}</td>
      <td style="font-size:11px;color:#059669">${r.lat ? r.lat.toFixed(5) : '—'}</td>
      <td style="font-size:11px;color:#059669">${r.lng ? r.lng.toFixed(5) : '—'}</td>
      <td style="font-size:11px;color:#94a3b8">${r.rep}</td>
      <td><span class="badge ${r.status==='ok'?'b-ok':r.status==='fail'?'b-fail':'b-pending'}">${r.status==='ok'?'✓':r.status==='fail'?'✗':'⏳'}</span></td>
    </tr>`).join('');
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

async function start() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('pauseBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'inline-block';
  paused = false; stopped = false;
  log('Starting geocoding…', 'info');

  for (let i = 0; i < results.length; i++) {
    if (stopped) break;
    while (paused) { await delay(300); }
    const r = results[i];
    if (r.status !== 'pending') continue;
    try {
      const geo = await geocode(r.address);
      if (geo) {
        r.lat = geo.lat; r.lng = geo.lng; r.formatted = geo.formatted; r.status = 'ok'; ok++;
        log(`✓ ${r.name}: ${geo.lat.toFixed(4)}, ${geo.lng.toFixed(4)}`, 'ok');
      } else {
        r.status = 'fail'; fail++;
        log(`✗ ${r.name}`, 'warn');
      }
    } catch(e) {
      r.status = 'fail'; fail++;
      log(`✗ ${r.name}: ${e.message}`, 'err');
    }
    updateStats(i+1);
    if ((i+1) % 20 === 0) renderTable();
    await delay(100);
  }

  renderTable();
  log('── Complete ──', 'info');
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('startBtn').textContent = '✓ Done';
}

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function stop() {
  stopped = true; paused = false;
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
  download();
}

function download() {
  const out = results.filter(r => r.status === 'ok').map(r => ({
    name: r.name, address: r.address, lat: r.lat, lng: r.lng, rep: r.rep, status: r.status, leadStatus: r.status
  }));
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'geocoded_prospects.json'; a.click();
}

renderTable();
