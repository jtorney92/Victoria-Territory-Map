var results = VENUES.map(function(v) { return Object.assign({}, v, {lat:null, lng:null, status:'pending'}); });
var ok=0, fail=0;

function log(msg, cls) {
  var el = document.getElementById('log');
  var d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function delay(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

async function geocode(addr) {
  var url = 'https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(addr) + '&key=' + API_KEY + '&region=au&components=country:AU';
  var resp = await fetch(url);
  var data = await resp.json();
  if(data.status === 'OK' && data.results && data.results.length) {
    var loc = data.results[0].geometry.location;
    return {lat: loc.lat, lng: loc.lng};
  }
  return null;
}

function render() {
  document.getElementById('tbody').innerHTML = results.map(function(r) {
    var badge = r.status==='ok' ? '<span class="b-ok">found</span>' : r.status==='fail' ? '<span class="b-fail">failed</span>' : '<span class="b-p">pending</span>';
    return '<tr><td>' + r.name + '</td><td style="color:#64748b;font-size:11px">' + r.address + '</td><td style="color:#059669;font-size:11px">' + (r.lat ? r.lat.toFixed(5) : '-') + '</td><td style="color:#059669;font-size:11px">' + (r.lng ? r.lng.toFixed(5) : '-') + '</td><td>' + badge + '</td></tr>';
  }).join('');
}

function updateStats(i) {
  document.getElementById('nOk').textContent = ok;
  document.getElementById('nFail').textContent = fail;
  document.getElementById('nLeft').textContent = VENUES.length - i;
  document.getElementById('nPct').textContent = Math.round(i/VENUES.length*100) + '%';
  document.getElementById('pbar').style.width = (i/VENUES.length*100).toFixed(1) + '%';
  document.getElementById('status').textContent = i + '/' + VENUES.length + ' processed, ' + ok + ' found, ' + fail + ' failed';
}

async function start() {
  document.getElementById('startBtn').disabled = true;
  log('Starting...', 'info');
  for(var i=0; i<results.length; i++) {
    var r = results[i];
    try {
      var geo = await geocode(r.address);
      if(geo) {
        r.lat = geo.lat; r.lng = geo.lng; r.status = 'ok'; ok++;
        log('OK: ' + r.name + ' ' + geo.lat.toFixed(4) + ',' + geo.lng.toFixed(4), 'ok');
      } else {
        r.status = 'fail'; fail++;
        log('FAIL: ' + r.name, 'warn');
      }
    } catch(e) {
      r.status = 'fail'; fail++;
      log('ERR: ' + r.name + ' - ' + e.message, 'warn');
    }
    updateStats(i+1);
    if((i+1) % 10 === 0) render();
    await delay(150);
  }
  render();
  log('Done', 'info');
  document.getElementById('startBtn').textContent = 'Done';
}

function download() {
  var out = results.filter(function(r) { return r.status === 'ok'; }).map(function(r) {
    return {name:r.name, address:r.address, lat:r.lat, lng:r.lng, rep:r.rep, status:'ok'};
  });
  var blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'geocoded_retry.json';
  a.click();
}

render();
</script>
