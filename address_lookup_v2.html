  .card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e2e8f0; text-align: center; }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: #64748b; margin-top: 2px; }

  #startBtn { background: #3b82f6; color: #fff; }
  #startBtn:disabled { background: #93c5fd; cursor: not-allowed; }
  #pauseBtn { background: #f59e0b; color: #fff; display: none; }
  #stopBtn { background: #ef4444; color: #fff; display: none; }
  #dlBtn { background: #059669; color: #fff; }
  .progress-wrap { background: #e2e8f0; border-radius: 99px; height: 8px; margin-bottom: 8px; overflow: hidden; }
  .progress-bar { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s; border-radius: 99px; }
  .status { font-size: 13px; color: #475569; margin-bottom: 16px; min-height: 18px; }
  .log-wrap { background: #1e293b; border-radius: 8px; padding: 10px 14px; height: 130px; overflow-y: auto; margin-bottom: 16px; font-family: monospace; font-size: 12px; }
  .log-wrap div { padding: 1px 0; }
  .ok { color: #4ade80; }
  .warn { color: #fbbf24; }
  .info { color: #93c5fb; }
  .err { color: #f87171; }
  .results-wrap { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; }
  .filters { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
  .filter-btn { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; cursor: pointer; }
  .filter-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
  td { padding: 7px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .b-ok { background: #dcfce7; color: #166534; }
  .b-fail { background: #f1f5f9; color: #94a3b8; }
  .b-pending { background: #fef9c3; color: #854d0e; }
  .tbody-scroll { max-height: 450px; overflow-y: auto; }

let results = VENUES.map(v => ({...v, address: null, status: 'pending'}));
let paused = false, stopped = false, found = 0, missed = 0;
let currentFilter = 'all';

function expandName(name) {
  return NAME_HINTS[name] || name;
}

function cleanSearchName(name) {
  // Strip noise suffixes
  return name
    .replace(/\s*\*.*$/, '')
    .replace(/\s*\(New\)/i, '')
    .replace(/\s*\(NEW OWNER\)/i, '')
    .replace(/#\d*$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

async function nominatim(query, viewbox = null) {
  try {
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&countrycodes=au&addressdetails=1`;
    if (viewbox) url += `&viewbox=${viewbox}&bounded=1`;
    const resp = await fetch(url, { headers: { 'Accept': 'application/json', 'User-Agent': 'VictoriaTerritoryMap/2.0' } });
    if (!resp.ok) return [];
    return await resp.json();
  } catch { return []; }
}

function parseAddress(hit) {
  const a = hit.address || {};
  const num = a.house_number || '';
  const road = a.road || '';
  const street = num && road ? `${num} ${road}` : road;
  const suburb = a.suburb || a.city_district || a.neighbourhood || a.town || a.village || a.municipality || '';
  const state = a.state || '';
  const post = a.postcode || '';
  const parts = [street, suburb, state, post].filter(Boolean);
  // Need at least street + something to be useful
  return (street && parts.length >= 2) ? parts.join(', ') : null;
}

function isMatch(searchName, hit) {
  if (!hit) return false;
  const country = (hit.address?.country_code || '').toLowerCase();
  if (country && country !== 'au') return false;

  // Must have a usable street address
  if (!hit.address?.road) return false;

  // Reject non-venue OSM types
  const bad = ['trail','track','path','waterway','river','creek','lake','peak','mount','national_park','nature_reserve','boundary','administrative'];
  const type = (hit.type || hit.class || hit.category || '').toLowerCase();
  if (bad.some(t => type.includes(t))) return false;

  // Check name words appear in result
  const display = (hit.display_name || '').toLowerCase();
  const stop = new Set(['the','and','bar','pub','hotel','cafe','restaurant','club','inn','arms','house','at','of','in','by','for','a','an','new','old','&']);
  const words = searchName.toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length >= 3 && !stop.has(w));

  if (words.length === 0) return false;
  // Require majority of meaningful words to match (more lenient than all)
  const matches = words.filter(w => display.includes(w));
  return matches.length >= Math.max(1, Math.floor(words.length * 0.5));
}

async function lookupVenue(originalName) {
  const expanded = expandName(originalName);
  const cleaned = cleanSearchName(expanded);

  // Search strategy: Melbourne first, then Geelong, then all of Vic, then bare name
  const strategies = [
    { query: `${cleaned} Melbourne Victoria`, viewbox: MEL_VIEWBOX },
    { query: `${cleaned} Victoria`, viewbox: MEL_VIEWBOX },
    { query: `${cleaned} Geelong Victoria`, viewbox: GEE_VIEWBOX },
    { query: `${cleaned} Victoria Australia`, viewbox: VIC_VIEWBOX },
    { query: `${cleaned} Victoria Australia`, viewbox: null },
  ];

  for (const s of strategies) {
    const hits = await nominatim(s.query, s.viewbox);
    for (const hit of hits) {
      if (isMatch(cleaned, hit)) {
        const addr = parseAddress(hit);
        if (addr) return addr;
      }
    }
    await delay(1000); // respect Nominatim 1 req/sec
  }
  return null;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function log(msg, cls = '') {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 500) el.removeChild(el.firstChild);
}

function updateStats(i) {
  document.getElementById('nFound').textContent = found;
  document.getElementById('nMiss').textContent = missed;
  document.getElementById('nLeft').textContent = VENUES.length - i;
  document.getElementById('nPct').textContent = Math.round(i / VENUES.length * 100) + '%';
  document.getElementById('pbar').style.width = (i / VENUES.length * 100).toFixed(1) + '%';
  document.getElementById('status').textContent = `${i} / ${VENUES.length} processed · ${found} found · ${missed} not found`;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  const filtered = results.filter(r =>
    currentFilter === 'all' ? true :
    currentFilter === 'found' ? r.status === 'found' :
    currentFilter === 'notfound' ? r.status === 'notfound' :
    r.status === 'pending'
  );
  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td>${r.name}</td>
      <td style="color:${r.status==='found'?'#065f46':'#9ca3af'}">${r.address || '—'}</td>
      <td style="font-size:11px;color:#64748b">${r.rep}</td>
      <td><span class="badge ${r.status==='found'?'b-ok':r.status==='pending'?'b-pending':'b-fail'}">${r.status==='found'?'✓ Found':r.status==='pending'?'⏳ Pending':'✗ Not found'}</span></td>
    </tr>`).join('');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

async function startLookup() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('pauseBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'inline-block';
  paused = false; stopped = false;

  log('Testing Nominatim connection…', 'info');
  try {
    const test = await fetch('https://nominatim.openstreetmap.org/search?q=Melbourne+Australia&format=json&limit=1');
    log(test.ok ? '✓ Connected OK' : '⚠ Connection issue: ' + test.status, test.ok ? 'ok' : 'warn');
  } catch(e) { log('✗ Cannot reach Nominatim: ' + e.message, 'err'); return; }

  for (let i = 0; i < VENUES.length; i++) {
    if (stopped) break;
    while (paused) { await delay(500); }

    const v = VENUES[i];
    const r = results.find(r => r.id === v.id);
    if (r.status !== 'pending') continue;

    log(`Searching: ${v.name}…`, 'info');
    try {
      const addr = await lookupVenue(v.name);
      if (addr) {
        r.address = addr; r.status = 'found'; found++;
        log(`  ✓ ${v.name}: ${addr}`, 'ok');
      } else {
        r.status = 'notfound'; missed++;
        log(`  ✗ ${v.name}: not found`, 'warn');
      }
    } catch(e) {
      r.status = 'notfound'; missed++;
      log(`  ✗ ${v.name}: error — ${e.message}`, 'err');
    }

    updateStats(i + 1);
    if ((i + 1) % 5 === 0) renderTable();
    await delay(200); // small extra gap between venues
  }

  renderTable();
  log('── Complete ──', 'info');
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
}

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
  document.getElementById('status').textContent = paused ? 'Paused — click Resume to continue' : 'Resuming…';
}

function stopLookup() {
  stopped = true;
  paused = false;
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
  downloadCSV();
}

function downloadCSV() {
  const rows = [['Internal ID','Name','Address','Sales Rep','Status']];
  results.forEach(r => rows.push([r.id, `"${r.name.replace(/"/g,'""')}"`, `"${(r.address||'').replace(/"/g,'""')}"`, `"${r.rep.replace(/"/g,'""')}"`, r.status]));
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'venue_addresses_v2.csv'; a.click();
}

renderTable();
